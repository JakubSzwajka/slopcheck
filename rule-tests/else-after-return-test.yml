id: else-after-return
valid:
  - "function f(a) { if (a) { x(); } else { y(); } }"
  - "function f(a, b) { if (a) return 1; else if (b) return 2; }"
  - "function f(a) { if (a) { return 1; later(); } else { y(); } }"
invalid:
  - "function f(a) { if (a) { x(); return 1; } else { y(); } }"
  - "function f(a) { if (a) return 1; else return 2; }"
